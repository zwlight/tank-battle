<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Battle City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
        }
        #gameWrapper {
            background: #16213e;
            border-radius: 16px;
            padding: 24px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        #canvasWrap {
            position: relative;
            border: 3px solid #0f3460;
            border-radius: 6px;
            background: #111;
            line-height: 0;
        }
        canvas { display: block; }
        #sidebar {
            width: 180px;
            color: #e0e0e0;
            padding-top: 6px;
        }
        #sidebar h1 {
            font-size: 22px;
            font-weight: 800;
            color: #f5c842;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 15px;
        }
        .stat-label { color: #888; }
        .stat-value { color: #fff; font-weight: 600; }
        .stat-value.score { color: #f5c842; }
        .stat-value.lives { color: #ff6b6b; }
        .controls-box {
            margin-top: 24px;
            padding: 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            font-size: 12px;
            color: #777;
            line-height: 1.8;
        }
        .controls-box strong { color: #aaa; }
        .key {
            display: inline-block;
            background: #2a2a3e;
            padding: 0 6px;
            border-radius: 3px;
            font-size: 11px;
            color: #ccc;
            border: 1px solid #444;
        }
        #restartBtn {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        #restartBtn:hover { background: #ff6b6b; }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.72);
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #overlay h2 {
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        #overlay p {
            font-size: 16px;
            color: #bbb;
            margin-bottom: 6px;
        }
        #overlay .sub {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        #overlay .blink {
            animation: blink 1.2s infinite;
            margin-top: 14px;
            font-size: 20px;
            color: #f5c842;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="canvasWrap">
            <canvas id="gameCanvas" width="520" height="520"></canvas>
            <div id="overlay">
                <h2 id="overlayTitle">坦克大战</h2>
                <p id="overlayMsg">按 ENTER 开始游戏</p>
                <div class="blink">▶</div>
            </div>
        </div>
        <div id="sidebar">
            <h1>坦克大战</h1>
            <div class="stat"><span class="stat-label">得分</span><span class="stat-value score" id="scoreDisplay">0</span></div>
            <div class="stat"><span class="stat-label">生命</span><span class="stat-value lives" id="livesDisplay">3</span></div>
            <div class="stat"><span class="stat-label">剩余敌人</span><span class="stat-value" id="enemyDisplay">20</span></div>
            <div class="stat"><span class="stat-label">关卡</span><span class="stat-value" id="levelDisplay">1</span></div>
            <div id="enemyIcons" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;min-height:32px;"></div>
            <div class="controls-box">
                <strong>操作</strong><br>
                <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 移动<br>
                <span class="key">Space</span> 射击<br>
                <span class="key">Enter</span> 开始
            </div>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
    // ============================================================
    //  CONSTANTS
    // ============================================================
    const CELL = 20;
    const COLS = 26;
    const ROWS = 26;
    const GAME_W = COLS * CELL;
    const GAME_H = ROWS * CELL;
    const TANK_SIZE = 28;
    const HALF_TANK = TANK_SIZE / 2;
    const BULLET_R = 3;
    const PLAYER_SPEED = 2.0;
    const BULLET_SPEED = 4.5;
    const ENEMY_SPEED = 1.2;
    const MAX_ENEMIES = 4;
    const TOTAL_ENEMIES = 20;
    const SPAWN_DELAY = 2500;

    const DIR = { UP:0, RIGHT:1, DOWN:2, LEFT:3 };
    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    // ============================================================
    //  LEVEL DATA
    // ============================================================
    const LEVEL_1 = [
        "WWWWWWWWWWWWWWWWWWWWWWWWWW",
        "W......................W",
        "W..##..##....##..##...W",
        "W..##..##....##..##...W",
        "W......................W",
        "W..##..........##.....W",
        "W..##..........##.....W",
        "W......................W",
        "W......@@....@@.......W",
        "W......@@....@@.......W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W..##..##....##..##...W",
        "W..##..##....##..##...W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W......................W",
        "W......#####..........W",
        "W......#...#..........W",
        "W......#.B.#..........W",
        "WWWWWWWWWWWWWWWWWWWWWWWWWW"
    ];

    // ============================================================
    //  CANVAS SETUP
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ============================================================
    //  DOM REFS
    // ============================================================
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const enemyDisplay = document.getElementById('enemyDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const enemyIcons = document.getElementById('enemyIcons');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMsg = document.getElementById('overlayMsg');
    const restartBtn = document.getElementById('restartBtn');

    // ============================================================
    //  GAME STATE
    // ============================================================
    let map = [];
    let player = null;
    let enemies = [];
    let bullets = [];
    let explosions = [];
    let base = null;
    let keys = {};
    let score = 0;
    let lives = 3;
    let level = 1;
    let enemiesRemaining = TOTAL_ENEMIES;
    let gameState = 'menu'; // menu | playing | gameover | win
    let lastSpawnTime = 0;
    let animFrameId = null;
    let lastTime = 0;

    // ============================================================
    //  LEVEL PARSING
    // ============================================================
    function loadLevel(levelData) {
        map = [];
        base = null;
        for (let r = 0; r < levelData.length; r++) {
            map[r] = [];
            for (let c = 0; c < levelData[r].length; c++) {
                const ch = levelData[r][c];
                switch (ch) {
                    case '#': map[r][c] = 1; break; // brick
                    case '@': map[r][c] = 2; break; // steel
                    case 'B':
                        map[r][c] = 0;
                        if (!base) {
                            base = {
                                x: c * CELL + CELL/2,
                                y: r * CELL + CELL/2,
                                w: 24,
                                h: 24,
                                alive: true
                            };
                        }
                        break;
                    default: map[r][c] = 0; break;
                }
            }
        }
    }

    function isSolid(col, row) {
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
        return map[row][col] !== 0;
    }

    // ============================================================
    //  COLLISION
    // ============================================================
    function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function canPlace(x, y, w, h, ignoreTank) {
        // boundaries
        if (x < 0 || y < 0 || x + w > GAME_W || y + h > GAME_H) return false;

        // map cells
        const c1 = Math.floor(x / CELL);
        const c2 = Math.floor((x + w - 1) / CELL);
        const r1 = Math.floor(y / CELL);
        const r2 = Math.floor((y + h - 1) / CELL);
        for (let r = r1; r <= r2; r++) {
            for (let c = c1; c <= c2; c++) {
                if (isSolid(c, r)) return false;
            }
        }

        // base collision
        if (base && base.alive) {
            const bbox = { x: base.x - base.w/2, y: base.y - base.h/2, w: base.w, h: base.h };
            if (rectsOverlap({x, y, w, h}, bbox)) return false;
        }

        // other tanks
        const tanks = [];
        if (player && ignoreTank !== player) tanks.push(player);
        for (const e of enemies) if (ignoreTank !== e) tanks.push(e);
        for (const t of tanks) {
            if (t.alive === false) continue;
            const tb = { x: t.x - HALF_TANK, y: t.y - HALF_TANK, w: TANK_SIZE, h: TANK_SIZE };
            if (rectsOverlap({x, y, w, h}, tb)) return false;
        }

        return true;
    }

    function canMove(tank, nx, ny) {
        return canPlace(nx - HALF_TANK, ny - HALF_TANK, TANK_SIZE, TANK_SIZE, tank);
    }

    // ============================================================
    //  EXPLOSION
    // ============================================================
    function spawnExplosion(x, y) {
        explosions.push({ x, y, t: 0, maxT: 20 });
    }

    // ============================================================
    //  TANK CLASS
    // ============================================================
    function createTank(x, y, dir, color, isPlayer) {
        return {
            x, y, dir, color,
            isPlayer: !!isPlayer,
            size: TANK_SIZE,
            alive: true,
            cooldown: 0,
            moveTimer: 0,
            aiDirChange: 0,
            aiShootTimer: 60 + Math.random() * 120,
            speed: isPlayer ? PLAYER_SPEED : ENEMY_SPEED,
            moving: false
        };
    }

    function destroyTank(tank) {
        if (!tank.alive) return;
        tank.alive = false;
        spawnExplosion(tank.x, tank.y);
    }

    function shootTank(tank) {
        if (tank.cooldown > 0) return;
        tank.cooldown = 18;

        const bx = tank.x + DX[tank.dir] * (HALF_TANK + BULLET_R + 2);
        const by = tank.y + DY[tank.dir] * (HALF_TANK + BULLET_R + 2);
        bullets.push({
            x: bx, y: by,
            dir: tank.dir,
            owner: tank,
            speed: BULLET_SPEED,
            alive: true
        });
    }

    function updateTank(tank) {
        if (!tank.alive) return;
        if (tank.cooldown > 0) tank.cooldown--;

        if (tank.moving) {
            const nx = tank.x + DX[tank.dir] * tank.speed;
            const ny = tank.y + DY[tank.dir] * tank.speed;
            if (canMove(tank, nx, ny)) {
                tank.x = nx;
                tank.y = ny;
            } else if (tank.isPlayer) {
                // player stops at walls
                tank.moving = false;
            }
        }
    }

    // ============================================================
    //  ENEMY AI
    // ============================================================
    function updateEnemyAI(tank) {
        if (!tank.alive) return;
        tank.aiDirChange--;
        tank.aiShootTimer--;

        if (tank.aiDirChange <= 0) {
            // 60% chance keep moving, 40% change direction
            if (Math.random() < 0.4) {
                tank.dir = Math.floor(Math.random() * 4);
            }
            tank.aiDirChange = 60 + Math.floor(Math.random() * 120);
        }

        // check if blocked ahead — change direction
        const aheadX = tank.x + DX[tank.dir] * tank.speed * 2;
        const aheadY = tank.y + DY[tank.dir] * tank.speed * 2;
        if (!canMove(tank, aheadX, aheadY)) {
            tank.dir = Math.floor(Math.random() * 4);
            tank.aiDirChange = 40 + Math.floor(Math.random() * 80);
        }

        // steer toward base sometimes
        if (Math.random() < 0.02 && base && base.alive) {
            const dx = base.x - tank.x;
            const dy = base.y - tank.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                tank.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
            } else {
                tank.dir = dy > 0 ? DIR.DOWN : DIR.UP;
            }
            tank.aiDirChange = 60 + Math.floor(Math.random() * 60);
        }

        // shoot
        if (tank.aiShootTimer <= 0) {
            shootTank(tank);
            tank.aiShootTimer = 40 + Math.floor(Math.random() * 100);
        }

        tank.moving = true;
    }

    // ============================================================
    //  BULLET UPDATE
    // ============================================================
    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (!b.alive) { bullets.splice(i, 1); continue; }

            b.x += DX[b.dir] * b.speed;
            b.y += DY[b.dir] * b.speed;

            // out of bounds
            if (b.x < 0 || b.x > GAME_W || b.y < 0 || b.y > GAME_H) {
                b.alive = false;
                bullets.splice(i, 1);
                continue;
            }

            // map collision
            const col = Math.floor(b.x / CELL);
            const row = Math.floor(b.y / CELL);
            if (col >= 0 && col < COLS && row >= 0 && row < ROWS && map[row][col] !== 0) {
                if (map[row][col] === 1) { // brick destroyed
                    map[row][col] = 0;
                    spawnExplosion(col * CELL + CELL/2, row * CELL + CELL/2);
                }
                b.alive = false;
                bullets.splice(i, 1);
                continue;
            }

            // base hit
            if (base && base.alive) {
                const bx = b.x, by = b.y;
                const dist = Math.sqrt((bx - base.x) ** 2 + (by - base.y) ** 2);
                if (dist < base.w/2 + BULLET_R) {
                    base.alive = false;
                    b.alive = false;
                    spawnExplosion(base.x, base.y);
                    bullets.splice(i, 1);
                    endGame('LOSE');
                    continue;
                }
            }

            // tank hits
            const allTanks = [];
            if (player && player.alive) allTanks.push(player);
            for (const e of enemies) if (e.alive) allTanks.push(e);

            for (const t of allTanks) {
                if (t === b.owner) continue;
                const dist = Math.sqrt((b.x - t.x) ** 2 + (b.y - t.y) ** 2);
                if (dist < TANK_SIZE/2 + BULLET_R) {
                    b.alive = false;
                    destroyTank(t);
                    if (t.isPlayer) {
                        lives--;
                        updateUI();
                        if (lives <= 0) {
                            endGame('LOSE');
                        } else {
                            respawnPlayer();
                        }
                    } else {
                        score += 100;
                        updateUI();
                    }
                    bullets.splice(i, 1);
                    break;
                }
            }
        }
    }

    // ============================================================
    //  PLAYER
    // ============================================================
    function spawnPlayer() {
        const px = 3 * CELL + CELL/2;
        const py = 24 * CELL + CELL/2;
        player = createTank(px, py, DIR.UP, '#f5c842', true);
    }

    function respawnPlayer() {
        const px = 3 * CELL + CELL/2;
        const py = 24 * CELL + CELL/2;
        const nx = px - HALF_TANK;
        const ny = py - HALF_TANK;
        if (canPlace(nx, ny, TANK_SIZE, TANK_SIZE, null)) {
            player.x = px;
            player.y = py;
            player.dir = DIR.UP;
            player.alive = true;
            player.cooldown = 0;
            player.moving = false;
        }
    }

    // ============================================================
    //  ENEMY SPAWNING
    // ============================================================
    const enemySpawnPoints = [
        { x: 2 * CELL + CELL/2, y: 1 * CELL + CELL/2 },
        { x: 12 * CELL + CELL/2, y: 1 * CELL + CELL/2 },
        { x: 22 * CELL + CELL/2, y: 1 * CELL + CELL/2 }
    ];

    function trySpawnEnemy() {
        if (enemiesRemaining <= 0) return;
        if (enemies.length >= MAX_ENEMIES) return;

        const colors = ['#e94560', '#c0392b', '#e67e22', '#8e44ad', '#2c3e50'];
        const sp = enemySpawnPoints[Math.floor(Math.random() * enemySpawnPoints.length)];
        const nx = sp.x - HALF_TANK;
        const ny = sp.y - HALF_TANK;

        if (canPlace(nx, ny, TANK_SIZE, TANK_SIZE, null)) {
            const tank = createTank(sp.x, sp.y, DIR.DOWN, colors[enemies.length % colors.length], false);
            enemies.push(tank);
            enemiesRemaining--;
            updateUI();
        }
    }

    // ============================================================
    //  GAME CONTROL
    // ============================================================
    function startGame() {
        score = 0;
        lives = 3;
        level = 1;
        enemiesRemaining = TOTAL_ENEMIES;
        gameState = 'playing';
        enemies = [];
        bullets = [];
        explosions = [];

        loadLevel(LEVEL_1);
        spawnPlayer();
        trySpawnEnemy();

        overlay.classList.remove('show');
        updateUI();
        lastSpawnTime = performance.now();
    }

    function endGame(result) {
        gameState = result === 'LOSE' ? 'gameover' : 'win';
        overlayTitle.textContent = result === 'LOSE' ? '💀 失败' : '🎉 胜利!';
        overlayMsg.textContent = result === 'LOSE' ? '基地被摧毁!' : '消灭了所有敌人!';
        document.querySelector('#overlay .blink').textContent = '按 ENTER 重新开始';
        overlay.classList.add('show');
        restartBtn.style.display = 'block';
    }

    function restartGame() {
        restartBtn.style.display = 'none';
        startGame();
    }

    // ============================================================
    //  UI UPDATE
    // ============================================================
    function updateUI() {
        scoreDisplay.textContent = score;
        livesDisplay.textContent = lives;
        enemyDisplay.textContent = enemiesRemaining;
        levelDisplay.textContent = level;

        enemyIcons.innerHTML = '';
        const remaining = enemiesRemaining + enemies.filter(e => e.alive).length;
        for (let i = 0; i < remaining && i < 40; i++) {
            const dot = document.createElement('span');
            dot.style.cssText = 'width:8px;height:8px;background:#e94560;border-radius:1px;display:inline-block;';
            enemyIcons.appendChild(dot);
        }
    }

    // ============================================================
    //  INPUT
    // ============================================================
    document.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (e.key === 'Enter' || e.key === ' ') {
            if (gameState === 'menu') {
                startGame();
            } else if (gameState === 'gameover' || gameState === 'win') {
                restartGame();
            }
        }
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
            e.preventDefault();
        }
    });

    document.addEventListener('keyup', e => {
        keys[e.key] = false;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
            e.preventDefault();
        }
    });

    restartBtn.addEventListener('click', restartGame);

    // ============================================================
    //  PLAYER INPUT HANDLING
    // ============================================================
    function handleInput() {
        if (!player || !player.alive || gameState !== 'playing') return;

        let moved = false;
        if (keys['ArrowUp']) { player.dir = DIR.UP; moved = true; }
        else if (keys['ArrowDown']) { player.dir = DIR.DOWN; moved = true; }
        else if (keys['ArrowLeft']) { player.dir = DIR.LEFT; moved = true; }
        else if (keys['ArrowRight']) { player.dir = DIR.RIGHT; moved = true; }

        player.moving = moved;

        if (keys[' '] || keys['Space']) {
            shootTank(player);
        }
    }

    // ============================================================
    //  DRAWING
    // ============================================================
    function drawMap() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = c * CELL, y = r * CELL;
                if (map[r][c] === 1) {
                    // brick wall
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x, y, CELL, CELL);
                    ctx.strokeStyle = '#6B3410';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, CELL, CELL);
                    // brick pattern
                    ctx.fillStyle = '#A0522D';
                    ctx.fillRect(x + 2, y + 2, 7, 7);
                    ctx.fillRect(x + 11, y + 2, 7, 7);
                    ctx.fillRect(x + 2, y + 11, 7, 7);
                    ctx.fillRect(x + 11, y + 11, 7, 7);
                    ctx.fillStyle = '#6B3410';
                    ctx.fillRect(x + 9, y, 1, CELL);
                    ctx.fillRect(x, y + 9, CELL, 1);
                } else if (map[r][c] === 2) {
                    // steel wall
                    ctx.fillStyle = '#888';
                    ctx.fillRect(x, y, CELL, CELL);
                    ctx.fillStyle = '#aaa';
                    ctx.fillRect(x + 1, y + 1, 8, 8);
                    ctx.fillRect(x + 11, y + 1, 8, 8);
                    ctx.fillRect(x + 1, y + 11, 8, 8);
                    ctx.fillRect(x + 11, y + 11, 8, 8);
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, CELL, CELL);
                }
            }
        }
    }

    function drawTank(tank) {
        if (!tank.alive) return;
        const x = tank.x - HALF_TANK;
        const y = tank.y - HALF_TANK;
        const s = TANK_SIZE;

        ctx.save();
        ctx.translate(tank.x, tank.y);
        ctx.rotate(tank.dir * Math.PI / 2);

        // tracks
        ctx.fillStyle = darkenColor(tank.color, 40);
        ctx.fillRect(-s/2, -s/2, s, 6);
        ctx.fillRect(-s/2, s/2 - 6, s, 6);

        // body
        ctx.fillStyle = tank.color;
        ctx.fillRect(-s/2 + 3, -s/2 + 3, s - 6, s - 6);

        // turret
        ctx.fillStyle = lightenColor(tank.color, 30);
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fill();

        // barrel
        ctx.fillStyle = darkenColor(tank.color, 60);
        ctx.fillRect(-3, -s/2 - 2, 6, s/2 - 1);

        ctx.restore();

        // health indicator for enemies
        if (!tank.isPlayer && tank.alive) {
            ctx.fillStyle = 'rgba(255,0,0,0.3)';
            ctx.fillRect(tank.x - s/2, tank.y - s/2 - 4, s, 3);
            ctx.fillStyle = '#e94560';
            ctx.fillRect(tank.x - s/2, tank.y - s/2 - 4, s, 3);
        }
    }

    function drawBase() {
        if (!base || !base.alive) return;
        const x = base.x - base.w/2;
        const y = base.y - base.h/2;

        // pedestal
        ctx.fillStyle = '#555';
        ctx.fillRect(x + 2, y + base.h - 6, base.w - 4, 4);

        // eagle / flag
        ctx.fillStyle = '#f5c842';
        ctx.beginPath();
        ctx.moveTo(x + base.w/2, y + 2);
        ctx.lineTo(x + base.w - 2, y + base.h/2);
        ctx.lineTo(x + 2, y + base.h/2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(x + base.w/2, y + base.h/2 - 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + base.w/2, y + base.h/2);
        ctx.lineTo(x + base.w/2, y + base.h - 6);
        ctx.stroke();

        // shield glow
        ctx.strokeStyle = 'rgba(255,255,200,0.15)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 4, y - 4, base.w + 8, base.h + 8);
    }

    function drawBullets() {
        for (const b of bullets) {
            if (!b.alive) continue;
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function drawExplosions() {
        for (let i = explosions.length - 1; i >= 0; i--) {
            const e = explosions[i];
            e.t++;
            const progress = e.t / e.maxT;
            const radius = 10 + progress * 16;
            const alpha = 1 - progress;

            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(e.x, e.y, radius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(e.x, e.y, radius * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            if (e.t >= e.maxT) {
                explosions.splice(i, 1);
            }
        }
    }

    // ============================================================
    //  COLOR HELPERS
    // ============================================================
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return [r, g, b];
    }

    function darkenColor(hex, amount) {
        const [r, g, b] = hexToRgb(hex);
        return `rgb(${Math.max(0,r-amount)},${Math.max(0,g-amount)},${Math.max(0,b-amount)})`;
    }

    function lightenColor(hex, amount) {
        const [r, g, b] = hexToRgb(hex);
        return `rgb(${Math.min(255,r+amount)},${Math.min(255,g+amount)},${Math.min(255,b+amount)})`;
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function render() {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        // grid
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= COLS; i++) {
            ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, GAME_H); ctx.stroke();
        }
        for (let i = 0; i <= ROWS; i++) {
            ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(GAME_W, i*CELL); ctx.stroke();
        }

        drawMap();

        if (base) drawBase();

        if (player) drawTank(player);

        for (const e of enemies) drawTank(e);

        drawBullets();
        drawExplosions();

        // border glow
        ctx.strokeStyle = '#0f3460';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, GAME_W, GAME_H);
    }

    // ============================================================
    //  GAME LOOP
    // ============================================================
    function checkWin() {
        if (enemiesRemaining <= 0 && enemies.every(e => !e.alive)) {
            endGame('WIN');
        }
    }

    function update(time) {
        if (gameState !== 'playing') return;

        handleInput();

        // update player
        if (player && player.alive) {
            updateTank(player);
        }

        // update enemies
        for (const e of enemies) {
            if (e.alive) {
                updateEnemyAI(e);
                updateTank(e);
            }
        }

        // remove dead enemies after delay
        enemies = enemies.filter(e => e.alive || false);

        // bullets
        updateBullets();

        // spawn enemies
        if (time - lastSpawnTime > SPAWN_DELAY) {
            trySpawnEnemy();
            lastSpawnTime = time;
        }

        // check win
        checkWin();
        updateUI();
    }

    function gameLoop(timestamp) {
        const delta = timestamp - lastTime;
        lastTime = timestamp;

        update(timestamp);
        render();

        animFrameId = requestAnimationFrame(gameLoop);
    }

    // ============================================================
    //  INIT
    // ============================================================
    function init() {
        loadLevel(LEVEL_1);
        overlay.classList.add('show');
        overlayTitle.textContent = '坦克大战';
        overlayMsg.textContent = '按 ENTER 开始游戏';
        document.querySelector('#overlay .blink').textContent = '▶';
        updateUI();
        animFrameId = requestAnimationFrame(gameLoop);
    }

    init();
    </script>
</body>
</html>
